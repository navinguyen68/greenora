<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREENORA Admin · Operations</title><style>
body{font:14px system-ui;background:#f3f6f2;color:#244235;margin:0}header{background:#163b30;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}h1{font:normal 27px Georgia,serif;margin:0}main{max-width:1150px;margin:auto;padding:20px}section{background:white;border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 2px 15px #173f3010}nav{display:flex;gap:9px;flex-wrap:wrap}button{background:#24543f;color:white;border:0;padding:11px 15px;border-radius:9px;cursor:pointer}button.alt{background:#e2eee4;color:#1e4b33}input,select,textarea{padding:10px;border:1px solid #c9d9ca;border-radius:8px;font:inherit;width:100%;box-sizing:border-box}label{font-weight:600;display:grid;gap:5px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form button{align-self:end}.wide{grid-column:span 3}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #e4ece5;text-align:left;padding:11px;vertical-align:top}th{background:#f2f6f1}.muted{color:#6b7f71}.hidden{display:none}.pill{background:#e9f3eb;border-radius:7px;padding:4px 8px;white-space:nowrap}@media(max-width:700px){.form{grid-template-columns:1fr}.wide{grid-column:span 1}}
body.embedded header,body.embedded main>section:first-child nav,body.embedded main>section:first-child h2,body.embedded main>section:first-child>p.muted{display:none!important}
body.embedded main{max-width:none;margin:0;padding:8px 12px}
body.embedded main>section:first-child{padding:0}
body.embedded #workspace{box-shadow:none;border:0;padding:0}
</style><style>
/* GREENORA V32 - Unicode Vietnamese typography; local fonts avoid missing glyphs. */
html{font-synthesis:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body,button,input,select,textarea,option,table{font-family:"Segoe UI",Tahoma,Arial,"Noto Sans",sans-serif!important;font-kerning:normal}
body{letter-spacing:normal!important;line-height:1.65}
h1,h2,h3,h4,h5,h6,.hero h1,.section h2,.banner h2,.local-destination-hero h1,.detail-top h2,.detail-copy h3,.detail-reserve h3,.card h3,.service-feature h3,.listing-preview h2,.logo{font-family:"Segoe UI",Tahoma,Arial,"Noto Sans",sans-serif!important;letter-spacing:normal!important;overflow-wrap:break-word}
.hero h1{font-weight:600;line-height:1.16}
.section h2,.banner h2,.detail-top h2{font-weight:600;line-height:1.25}
.logo{font-weight:750}
.eyebrow,.hero-search-label{letter-spacing:.1em!important}
@supports (font-variation-settings:normal){body{font-feature-settings:"kern" 1}}
</style></head><body><header><h1>GREENORA Admin · Operations</h1><a href="/admin" style="color:white">← Hộp thư dịch vụ</a></header><main><section><h2>Điều hành lưu trú và đối tác</h2><p class="muted">Chỉ nhân sự có tài khoản được truy cập. Thông tin ký hợp đồng và thanh toán là xác nhận thủ công trong bản thử nghiệm.</p><nav id="nav"><button onclick="show('partners')">Đối tác</button><button onclick="show('contracts')">Hợp đồng</button><button onclick="show('apartments')">Căn hộ</button><button onclick="show('reservations')">Lịch phòng</button><button onclick="show('payments')">Thanh toán</button><button onclick="show('ai')">AI Concierge</button></nav><p id="notice" class="muted"></p></section><section id="workspace"></section></main><script>
let user=null;let cache={};const $=id=>document.getElementById(id);
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.error||'Lỗi');return d}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('vi-VN').format(n||0)+' đ';
const field=(label,name,type='text',value='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0"':''} required></label>`;
const sel=(label,name,options)=>`<label>${label}<select name="${name}">${options.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('')}</select></label>`;
const opts=(arr,label)=>arr.map(x=>[x.id,label(x)]);
const table=(headers,rows)=>`<div class="table"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${headers.length}">Chưa có dữ liệu</td></tr>`}</tbody></table></div>`;
async function load(){for(const type of ['partners','contracts','apartments','reservations','payments'])cache[type]=(await api('/api/'+type)).items}
async function save(type,e){e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));if(type==='apartments'){d.amenities=(d.amenities||'').split(',').map(x=>x.trim()).filter(Boolean);d.photos=(d.photos||'').split('\n').map(x=>x.trim()).filter(Boolean)}await api('/api/'+type,d);$('notice').textContent='Đã tạo '+type;await load();show(type)}catch(e){alert(e.message)}}
async function action(path,body,type){try{await api(path,body);await load();show(type)}catch(e){alert(e.message)}}
const form=(type,fields)=>`<form class="form" onsubmit="save('${type}',event)">${fields}<button>Tạo mới</button></form>`;
function show(type){
 let html='';
 if(type==='partners'){html='<h2>1 · Đối tác</h2>'+form(type,field('Tên đối tác','name')+field('Số liên hệ','contact')+sel('Loại','kind',[['owner','Chủ nhà'],['homestay','Đơn vị homestay']]))+table(['ID','Tên','Loại','Liên hệ'],cache.partners.map(x=>[x.id,esc(x.name),esc(x.kind),esc(x.contact)]))}
 if(type==='contracts'){html='<h2>2 · Hợp đồng đối tác</h2>'+form(type,sel('Đối tác','partner_id',opts(cache.partners,x=>x.name))+field('Mã hợp đồng','reference')+field('Ghi chú','notes'))+table(['ID','Đối tác','Mã','Trạng thái','Hành động'],cache.contracts.map(x=>[x.id,esc(cache.partners.find(y=>y.id===x.partner_id)?.name),esc(x.reference),esc(x.status),x.status==='signed'?'Đã ký':`<button onclick="action('/api/contracts/${x.id}/sign',{},'contracts')">Xác nhận đã ký</button>`]))}
 if(type==='apartments'){html='<h2>3 · Đăng tin căn hộ</h2><p class="muted">Chỉ xuất bản khi có hợp đồng đã ký và kiểm định chất lượng. Dữ liệu công khai có tại /api/public/apartments.</p>'+form(type,sel('Đối tác','partner_id',opts(cache.partners,x=>x.name))+sel('Hợp đồng','contract_id',[[0,'Chưa có'],...opts(cache.contracts,x=>x.reference)])+field('Tên căn hộ','title')+field('Khu vực','place')+field('Tòa nhà','building')+field('Diện tích m²','area','number')+sel('Giường','bed_type',[['King','King'],['Queen','Queen'],['Twin','Twin']])+field('Số phòng ngủ','bedrooms','number')+field('Sức chứa','capacity','number')+field('Giá / đêm VNĐ','night_price','number')+'<label class="wide">Tiện nghi (cách nhau bằng dấu phẩy)<textarea name="amenities"></textarea></label><label class="wide">URL hình ảnh (mỗi dòng một ảnh)<textarea name="photos"></textarea></label>')+table(['ID','Căn hộ','Đối tác','Giá / đêm','Trạng thái','Xuất bản'],cache.apartments.map(x=>[x.id,esc(x.title)+'<br>'+esc(x.place),esc(cache.partners.find(y=>y.id===x.partner_id)?.name),fmt(x.night_price),esc(x.status),x.status==='published'?'Đã đăng':`<button onclick="action('/api/apartments/${x.id}/publish',{quality_approved:true},'apartments')">Duyệt & đăng</button>`]))}
 if(type==='reservations'){html='<h2>4 · Lịch phòng & đặt chỗ</h2><p class="muted">Kiểm tra trùng lịch trên máy chủ; hai đơn giữ chỗ hoặc xác nhận không thể trùng ngày.</p>'+form(type,sel('Căn hộ','apartment_id',opts(cache.apartments.filter(x=>x.status==='published'),x=>x.title))+field('Tên khách','guest_name')+field('Điện thoại','guest_phone')+field('Nhận phòng','check_in','date')+field('Trả phòng','check_out','date'))+table(['ID','Căn hộ','Khách','Ngày','Tổng','Trạng thái'],cache.reservations.map(x=>[x.id,esc(cache.apartments.find(y=>y.id===x.apartment_id)?.title),esc(x.guest_name),esc(x.check_in)+' → '+esc(x.check_out),fmt(x.amount),`<span class="pill">${esc(x.status)}</span> <button class="alt" onclick="action('/api/reservations/${x.id}/status',{status:'confirmed'},'reservations')">Xác nhận</button> <button class="alt" onclick="action('/api/reservations/${x.id}/status',{status:'cancelled'},'reservations')">Hủy</button>`]))}
 if(type==='payments'){html='<h2>5 · Theo dõi thanh toán</h2><p class="muted">Chỉ ghi nhận thanh toán thủ công, chưa tích hợp cổng thanh toán hoặc đối soát ngân hàng. Không thu thập thông tin thẻ.</p>'+form(type,field('Mã đặt phòng (để trống nếu thanh toán dịch vụ)','reservation_id','number')+field('Mã yêu cầu dịch vụ (để trống nếu đặt phòng)','request_id','number')+field('Số tiền VNĐ','amount','number'))+table(['ID','Loại','Số tiền','Trạng thái','Xác nhận thủ công'],cache.payments.map(x=>[x.id,x.reservation_id?'Phòng #'+x.reservation_id:'Dịch vụ #'+x.request_id,fmt(x.amount),esc(x.status),`<button onclick="action('/api/payments/${x.id}/status',{status:'paid',reference:'manual-admin'},'payments')">Đánh dấu đã thu</button>`]))}
 if(type==='ai'){html='<h2>6 · AI Concierge</h2><p>AI trả lời qua API máy chủ, khóa API chỉ lưu trong biến môi trường. AI không được tự ý xuất bản căn hộ, tạo xác nhận thanh toán hoặc duyệt hợp đồng.</p><form onsubmit="askAI(event)"><textarea id="question" placeholder="Hỏi thử AI Concierge" style="width:100%"></textarea><button>Hỏi AI</button></form><pre id="answer" style="white-space:pre-wrap"></pre><p class="muted">Dữ liệu căn hộ công khai: <a href="/api/public/apartments" target="_blank">Xem API căn hộ</a>. Bước tiếp theo: cung cấp công cụ truy vấn dữ liệu có kiểm soát cho AI.</p>'}
 $('workspace').innerHTML=html;
}
async function askAI(e){e.preventDefault();try{const d=await api('/api/chat',{message:$('question').value});$('answer').textContent=d.reply}catch(e){$('answer').textContent=e.message}}
if(new URLSearchParams(location.search).get('embedded')==='1')document.body.classList.add('embedded');
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==parent)return;
 if(e.data?.type==='greenora-switch-section'&&['partners','contracts','apartments','reservations','payments','ai'].includes(e.data.section))show(e.data.section);
});
(async()=>{try{user=(await api('/api/me')).user;if(!user){location.href='/admin';return}await load();const tab=location.hash.slice(1);show(['partners','contracts','apartments','reservations','payments','ai'].includes(tab)?tab:'partners')}catch(e){$('notice').textContent=e.message}})();
</script></body></html>
